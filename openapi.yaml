            - type: 'null'
        closeout:
          oneOf:
            - $ref: '#/components/schemas/MonthCloseoutSaved'
            - type: 'null'
      required: [month, status, is_closeable, computed, closeout]

    MonthCloseoutListItem:
      type: object
      properties:
        id:
          type: string
        month:
          type: string
          pattern: '^\\d{4}-\\d{2}$'
        status:
          type: string
          enum: [closed, reopened]
        result_type:
          $ref: '#/components/schemas/MonthCloseoutResultType'
        surplus_amount:
          $ref: '#/components/schemas/Money'
        deficit_amount:
          $ref: '#/components/schemas/Money'
        allocated_amount:
          $ref: '#/components/schemas/Money'
        unallocated_amount:
          $ref: '#/components/schemas/Money'
        is_stale:
          type: boolean
        closed_at:
          type: string
          format: date-time
      required:
        - id
        - month
        - status
        - result_type
        - surplus_amount
        - deficit_amount
        - allocated_amount
        - unallocated_amount
        - is_stale
        - closed_at

    MonthCloseoutListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MonthCloseoutListItem'
      required: [items]

    CloseMonthRequest:
      type: object
      properties:
        notes:
          type: [string, 'null']
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/MonthCloseoutAllocationInput'

    UpdateMonthCloseoutRequest:
      type: object
      properties:
        notes:
          type: [string, 'null']
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/MonthCloseoutAllocationInput'
