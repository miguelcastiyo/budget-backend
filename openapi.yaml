openapi: 3.1.0
info:
  title: Budget API
  version: 1.0.0
  description: Session-based API contract for the budget app backend. Sensitive auth, account, import/export, and metrics routes may return 429 RATE_LIMITED when configured limits are exceeded.
servers:
  - url: /api/v1
    description: v1 base path
security:
  - cookieAuth: []
  - sessionTokenAuth: []
  - masterApiKeyAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: ApiKeys
  - name: AuditLogs
  - name: Tags
  - name: Cards
  - name: Contexts
  - name: Recurring
  - name: BudgetSettings
  - name: Transactions
  - name: Funds
  - name: Metrics
  - name: MonthOverview
  - name: MonthCloseouts
  - name: ImportExport
  - name: DataRuns
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API process liveness
      description: Lightweight liveness check. Does not require authentication and does not open a database connection.
      security: []
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Check API readiness
      description: Readiness check for dependencies required to serve normal API traffic.
      security: []
      responses:
        '200':
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /auth/invitations:
    get:
      tags: [Auth]
      summary: List invites
      description: Requires owner privileges. Revoked invites remain visible for account history and cannot be accepted.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Auth]
      summary: Create an invite
      description: Requires owner privileges.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/{invite_id}:
    delete:
      tags: [Auth]
      summary: Revoke an invite
      description: Requires owner privileges. Only pending, non-expired invites can be revoked.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
        - in: path
          name: invite_id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Invite revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/preview:
    get:
      tags: [Auth]
      summary: Preview invite acceptance path
      description: Returns the invited email plus the preferred initial invite-acceptance branch. Gmail addresses map to Google; all other addresses map to password setup.
      security: []
      parameters:
        - in: query
          name: invite_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/accept-password:
    post:
      tags: [Auth]
      summary: Accept invite with email/password
      description: Creates an invited password account, creates a session, and completes invite acceptance. Frontends should use this route for invite-token password setup rather than sending new invitees to the normal sign-in form.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitePasswordRequest'
      responses:
        '201':
          description: User created and session issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/accept-google:
    post:
      tags: [Auth]
      summary: Accept invite with Google
      description: Creates or resolves the invited Google account, creates a session, and completes invite acceptance. When an invite token is present, frontends should keep users in invite-acceptance mode and use this route instead of the normal Google sign-in route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteGoogleRequest'
      responses:
        '201':
          description: User created and session issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/password:
    post:
      tags: [Auth]
      summary: Sign in with email/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/google:
    post:
      tags: [Auth]
      summary: Sign in with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/current:
    delete:
      tags: [Auth]
      summary: Sign out current session
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request an email/password account reset link
      description: Always returns the same accepted response for valid email syntax. Only active password accounts receive reset emails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset with reset token
      description: Sets a new password, marks the reset token used, and revokes existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /me:
    get:
      tags: [Profile]
      summary: Get profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Profile]
      summary: Update display name
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/setup-status:
    get:
      tags: [Profile]
      summary: Get first-run setup status
      description: Returns deterministic setup state for onboarding and dashboard prompts.
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me/onboarding-state:
    patch:
      tags: [Profile]
      summary: Update first-run onboarding visibility state
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnboardingStateRequest'
      responses:
        '200':
          description: Onboarding state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOnboardingStateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/preferences:
    get:
      tags: [Profile]
      summary: Get user preferences
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Profile]
      summary: Update user preferences
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: User preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/settings-summary:
    get:
      tags: [Profile]
      summary: Get Settings page account summary
      description: Returns account summary stats used by the Settings landing page without requiring the frontend to load all transactions.
      responses:
        '200':
          description: Settings summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me/email-change/request:
    post:
      tags: [Profile]
      summary: Request email change (password users only)
      description: Rate limited.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
      responses:
        '202':
          description: Verification pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeRequestedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/email-change/verify:
    post:
      tags: [Profile]
      summary: Verify email change code
      description: Rate limited.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailChangeRequest'
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeVerifiedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/auth/convert-google:
    post:
      tags: [Profile]
      summary: Convert current password account to Google sign-in
      description: Session auth only. The Google account email must match the current user email.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertAccountToGoogleRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/master-api-keys:
    get:
      tags: [ApiKeys]
      summary: List master API keys (metadata only)
      description: Session auth only. Raw key values are never returned.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      responses:
        '200':
          description: Master API key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterApiKeyListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [ApiKeys]
      summary: Create a master API key
      description: Session auth only. Returns full key once at creation. expires_at may be null for a non-expiring key; provided expirations must be future-dated and within the configured max TTL.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMasterApiKeyRequest'
      responses:
        '201':
          description: Master API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMasterApiKeyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/master-api-keys/{api_key_id}:
    delete:
      tags: [ApiKeys]
      summary: Revoke a master API key
      description: Session auth only.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Key revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/audit-logs:
    get:
      tags: [AuditLogs]
      summary: List recent audit log events
      description: Session auth only. Owner/admin access required.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Audit log events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /me/tags:
    get:
      tags: [Tags]
      summary: List tags
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Tags]
      summary: Create tag
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/tags/quick-picks:
    get:
      tags: [Tags]
      summary: List most-used tag quick picks
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Tag quick picks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/tags/{tag_id}:
    patch:
      tags: [Tags]
      summary: Update tag
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tags]
      summary: Delete tag
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Tag deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/cards:
    get:
      tags: [Cards]
      summary: List cards
      description: Returns active, non-deleted cards ordered by favorite first, then case-insensitive name, then id.
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                required: [items]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Cards]
      summary: Create card
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamedEntityRequest'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/cards/{card_id}:
    patch:
      tags: [Cards]
      summary: Update card
      description: Accepts a partial card update. At least one of `name` or `is_favorite` is required.
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Cards]
      summary: Delete card
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Card deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/contexts:
    get:
      tags: [Contexts]
      summary: List contexts
      responses:
        '200':
          description: Active contexts ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Contexts]
      summary: Create or reactivate a context
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextRequest'
      responses:
        '201':
          description: Context created or reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/contexts/{context_id}:
    patch:
      tags: [Contexts]
      summary: Rename context
      parameters:
        - $ref: '#/components/parameters/ContextId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContextRequest'
      responses:
        '200':
          description: Context updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Contexts]
      summary: Soft delete context
      parameters:
