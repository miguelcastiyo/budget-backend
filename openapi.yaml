openapi: 3.1.0
info:
  title: Budget API
  version: 1.0.0
  description: Session-based API contract for the budget app backend. Sensitive auth, account, import/export, and metrics routes may return 429 RATE_LIMITED when configured limits are exceeded.
servers:
  - url: /api/v1
    description: v1 base path
security:
  - cookieAuth: []
  - sessionTokenAuth: []
  - masterApiKeyAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: ApiKeys
  - name: AuditLogs
  - name: Tags
  - name: Cards
  - name: Recurring
  - name: BudgetSettings
  - name: Transactions
  - name: Metrics
  - name: ImportExport
  - name: DataRuns
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API process liveness
      description: Lightweight liveness check. Does not require authentication and does not open a database connection.
      security: []
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Check API readiness
      description: Readiness check for dependencies required to serve normal API traffic.
      security: []
      responses:
        '200':
          description: API dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /auth/invitations:
    get:
      tags: [Auth]
      summary: List invites
      description: Requires owner privileges.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [Auth]
      summary: Create an invite
      description: Requires owner privileges.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/accept-password:
    post:
      tags: [Auth]
      summary: Accept invite with email/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitePasswordRequest'
      responses:
        '201':
          description: User created and session issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/invitations/accept-google:
    post:
      tags: [Auth]
      summary: Accept invite with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteGoogleRequest'
      responses:
        '201':
          description: User created and session issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/password:
    post:
      tags: [Auth]
      summary: Sign in with email/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/google:
    post:
      tags: [Auth]
      summary: Sign in with Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Set when client_type is web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions/current:
    delete:
      tags: [Auth]
      summary: Sign out current session
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Session invalidated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request an email/password account reset link
      description: Always returns the same accepted response for valid email syntax. Only active password accounts receive reset emails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset with reset token
      description: Sets a new password, marks the reset token used, and revokes existing sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmedResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /me:
    get:
      tags: [Profile]
      summary: Get profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Profile]
      summary: Update display name
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/preferences:
    get:
      tags: [Profile]
      summary: Get user preferences
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Profile]
      summary: Update user preferences
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: User preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/settings-summary:
    get:
      tags: [Profile]
      summary: Get Settings page account summary
      description: Returns account summary stats used by the Settings landing page without requiring the frontend to load all transactions.
      responses:
        '200':
          description: Settings summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me/email-change/request:
    post:
      tags: [Profile]
      summary: Request email change (password users only)
      description: Rate limited.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
      responses:
        '202':
          description: Verification pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeRequestedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/email-change/verify:
    post:
      tags: [Profile]
      summary: Verify email change code
      description: Rate limited.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailChangeRequest'
      responses:
        '200':
          description: Email updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeVerifiedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/auth/convert-google:
    post:
      tags: [Profile]
      summary: Convert current password account to Google sign-in
      description: Session auth only. The Google account email must match the current user email.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertAccountToGoogleRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/master-api-keys:
    get:
      tags: [ApiKeys]
      summary: List master API keys (metadata only)
      description: Session auth only. Raw key values are never returned.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      responses:
        '200':
          description: Master API key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterApiKeyListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      tags: [ApiKeys]
      summary: Create a master API key
      description: Session auth only. Returns full key once at creation. expires_at may be null for a non-expiring key; provided expirations must be future-dated and within the configured max TTL.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMasterApiKeyRequest'
      responses:
        '201':
          description: Master API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMasterApiKeyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/master-api-keys/{api_key_id}:
    delete:
      tags: [ApiKeys]
      summary: Revoke a master API key
      description: Session auth only.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Key revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/audit-logs:
    get:
      tags: [AuditLogs]
      summary: List recent audit log events
      description: Session auth only. Owner/admin access required.
      security:
        - cookieAuth: []
        - sessionTokenAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Audit log events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /me/tags:
    get:
      tags: [Tags]
      summary: List tags
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Tags]
      summary: Create tag
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/tags/quick-picks:
    get:
      tags: [Tags]
      summary: List most-used tag quick picks
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Tag quick picks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/tags/{tag_id}:
    patch:
      tags: [Tags]
      summary: Update tag
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          description: Tag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Tags]
      summary: Delete tag
      parameters:
        - $ref: '#/components/parameters/TagId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Tag deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/cards:
    get:
      tags: [Cards]
      summary: List cards
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                required: [items]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Cards]
      summary: Create card
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamedEntityRequest'
      responses:
        '201':
          description: Card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/cards/{card_id}:
    patch:
      tags: [Cards]
      summary: Update card
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamedEntityRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Cards]
      summary: Delete card
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Card deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/recurring-expenses:
    get:
      tags: [Recurring]
      summary: List recurring expenses
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        '200':
          description: Recurring expenses + committed total for month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringExpensesResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Recurring]
      summary: Create recurring expense rule
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringExpenseRequest'
      responses:
        '201':
          description: Recurring expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringExpense'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/recurring-expenses/{recurring_expense_id}:
    patch:
      tags: [Recurring]
      summary: Update recurring expense rule
      parameters:
        - $ref: '#/components/parameters/RecurringExpenseId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringExpenseRequest'
      responses:
        '200':
          description: Recurring expense updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringExpense'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Recurring]
      summary: Delete recurring expense rule
      parameters:
        - $ref: '#/components/parameters/RecurringExpenseId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Recurring expense deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/budget-settings:
    get:
      tags: [BudgetSettings]
      summary: Get budget settings
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
          description: Optional month for effective-dated budget resolution.
      responses:
        '200':
          description: Budget settings. Without month this is the flat latest/current settings shape; with month this is the resolved month-aware shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BudgetSettings'
                  - $ref: '#/components/schemas/BudgetSettingsResolvedResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [BudgetSettings]
      summary: Upsert budget settings
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BudgetSettingsPercentInput'
                - $ref: '#/components/schemas/BudgetSettingsAmountInput'
      responses:
        '200':
          description: Budget settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSettings'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Preset'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/TagIds'
        - $ref: '#/components/parameters/CardIds'
        - $ref: '#/components/parameters/IsSplit'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsPage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Transactions]
      summary: Create transaction
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions/suggestions:
    get:
      tags: [Transactions]
      summary: Suggest transaction setup from prior matching expenses
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
          description: Merchant or description text to match against previous transaction expenses.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Suggested transaction setups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSuggestionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions/{transaction_id}:
    patch:
      tags: [Transactions]
      summary: Update transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Transactions]
      summary: Delete transaction
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: Transaction deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /me/metrics/tags:
    get:
      tags: [Metrics]
      summary: Monthly tag spend metrics
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Tag metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagMetricsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/metrics/categories:
    get:
      tags: [Metrics]
      summary: Monthly category budget vs actual
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Category metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryMetricsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/dashboard:
    get:
      tags: [Metrics]
      summary: Aggregated dashboard payload for the homepage
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/metrics/insights:
    get:
      tags: [Metrics]
      summary: Aggregated insights metrics for a date range
      parameters:
        - $ref: '#/components/parameters/InsightsDateFrom'
        - $ref: '#/components/parameters/InsightsDateTo'
      responses:
        '200':
          description: Insights metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightsMetricsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions/export.csv:
    get:
      tags: [ImportExport]
      summary: Export filtered transactions as CSV
      description: Streams filtered transactions as CSV. Exported cell values are escaped when they start with spreadsheet formula prefixes.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Preset'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/TagIds'
        - $ref: '#/components/parameters/CardIds'
        - $ref: '#/components/parameters/IsSplit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions/import.csv:
    post:
      tags: [ImportExport]
      summary: Import transactions from CSV
      description: Preview reads CSV headers, sample rows, and column value profiles. Dry run and commit validate an explicit header mapping, category strategy, and amount strategy before importing valid rows. Row-level errors are capped in the response.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [preview, dry_run, commit]
                mapping:
                  type: string
                  description: JSON object mapping Budget fields to CSV headers. Required for dry_run and commit. Required fields are date, expense, amount, and tag. Category is required only when category_strategy.mode is exact_column; optional fields are card and is_split.
                date_strategy:
                  type: string
                  description: JSON object matching CsvImportDateStrategy. Applies an explicit year to yearless dates.
                category_strategy:
                  type: string
                  description: JSON object matching CsvImportCategoryStrategy. Supports exact_column, value_map, and default.
                tag_strategy:
                  type: string
                  description: JSON object matching CsvImportTagStrategy. Maps source tag values to existing or new tags.
                amount_strategy:
                  type: string
                  description: JSON object matching CsvImportAmountStrategy. Supports blank_mapped_amount=error or skip.
              required: [file, mode]
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CsvImportPreviewResponse'
                  - $ref: '#/components/schemas/CsvImportResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/data-runs:
    get:
      tags: [DataRuns]
      summary: List recent import/export activity
      description: Returns recent committed CSV imports and CSV exports for the authenticated user. Export records are activity-only and do not include saved CSV files.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of activity records to return. Values are clamped to 1..100.
      responses:
        '200':
          description: Recent data runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRunsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me/imports/{import_run_id}/transactions:
    delete:
      tags: [ImportExport]
      summary: Roll back transactions from a CSV import
      description: Soft-deletes transactions created by a committed CSV import. Tags and cards are left in place. Imports committed before transaction rows stored import-run linkage return ROLLBACK_UNAVAILABLE.
      parameters:
        - name: import_run_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: Import rollback result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRollbackResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    sessionTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use format `Session <session_token>`.
    masterApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Non-session master key for testing, format `bgtm_...`.

  parameters:
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Required for non-GET requests when using cookie sessions.
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        type: string
    RecurringExpenseId:
      name: recurring_expense_id
      in: path
      required: true
      schema:
        type: string
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
    Month:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}$'
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
    InsightsDateFrom:
      name: date_from
      in: query
      required: true
      schema:
        type: string
        format: date
    InsightsDateTo:
      name: date_to
      in: query
      required: true
      schema:
        type: string
        format: date
    Preset:
      name: preset
      in: query
      required: false
      schema:
        type: string
        enum: [last_7_days, last_30_days, month_to_date, last_month, quarter_to_date]
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Case-insensitive substring match against expense, tag name, and card name.
    Categories:
      name: categories
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated category values.
    TagIds:
      name: tag_ids
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated tag IDs.
    CardIds:
      name: card_ids
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated card IDs.
    IsSplit:
      name: is_split
      in: query
      required: false
      schema:
        type: string
        enum: [split, not_split]
      description: Filter by split flag. Omit for all transactions.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [date_desc, date_asc]

  responses:
    UnauthorizedError:
      description: Authentication required or invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Action not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitedError:
      description: Too many attempts in the configured rate-limit window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          enum: [true]
        service:
          type: string
          enum: [budget-api]
        check:
          type: string
          enum: [health]
        time:
          type: string
          format: date-time
      required: [ok, service, check, time]

    ReadinessResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
          enum: [budget-api]
        check:
          type: string
          enum: [ready]
        dependencies:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
          required: [database]
        time:
          type: string
          format: date-time
      required: [ok, service, check, dependencies, time]

    CreateInviteRequest:
      type: object
      properties:
        invitee_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        expires_at:
          type: string
          format: date-time
        email_subject:
          type: string
          minLength: 1
          maxLength: 160
        email_body:
          type: string
          minLength: 1
          maxLength: 5000
      required: [invitee_name, email, role, expires_at, email_subject, email_body]

    InviteResponse:
      type: object
      properties:
        invite_id:
          type: string
        invitee_name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
        accepted_at:
          type: [string, 'null']
          format: date-time
      required: [invite_id, invitee_name, email, role, status, expires_at, created_at, accepted_at]

    InvitesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InviteResponse'
      required: [items]

    AcceptInvitePasswordRequest:
      type: object
      properties:
        invite_token:
          type: string
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [invite_token, display_name, password]

    AcceptInviteGoogleRequest:
      type: object
      properties:
        invite_token:
          type: string
        google_id_token:
          type: string
        display_name:
          type: string
          minLength: 1
          maxLength: 120
      required: [invite_token, google_id_token, display_name]

    PasswordSignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        client_type:
          type: string
          enum: [web, native]
      required: [email, password, client_type]

    GoogleSignInRequest:
      type: object
      properties:
        google_id_token:
          type: string
        client_type:
          type: string
          enum: [web, native]
      required: [google_id_token, client_type]

    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    PasswordResetRequestedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
      required: [status, message]

    PasswordResetConfirmRequest:
      type: object
      properties:
        reset_token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
      required: [reset_token, password]

    PasswordResetConfirmedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [completed]
        message:
          type: string
      required: [status, message]

    SessionInfo:
      type: object
      properties:
        session_id:
          type: string
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          description: Send as `X-CSRF-Token` for non-GET requests when authenticated via cookie session.
        session_token:
          type: string
          description: Returned only for native clients.
      required: [session_id, expires_at, csrf_token]

    ThemePreference:
      type: string
      enum: [light, dark, system]

    AppearancePreferences:
      type: object
      properties:
        theme:
          $ref: '#/components/schemas/ThemePreference'
      required: [theme]

    UserPreferences:
      type: object
      properties:
        appearance:
          $ref: '#/components/schemas/AppearancePreferences'
      required: [appearance]

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        auth_provider:
          type: string
          enum: [password, google]
        role:
          type: string
          enum: [owner, admin, member]
        onboarding_complete:
          type: boolean
        user_preferences:
          $ref: '#/components/schemas/UserPreferences'
      required: [id, email, display_name, auth_provider, role, onboarding_complete, user_preferences]

    AuthSessionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
      required: [user, session]

    Profile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri
        auth_provider:
          type: string
          enum: [password, google]
        role:
          type: string
          enum: [owner, admin, member]
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        onboarding_complete:
          type: boolean
        user_preferences:
          $ref: '#/components/schemas/UserPreferences'
      required: [id, email, display_name, auth_provider, role, email_verified, created_at, onboarding_complete, user_preferences]

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
      required: [display_name]

    UpdateUserPreferencesRequest:
      type: object
      properties:
        appearance:
          type: object
          properties:
            theme:
              $ref: '#/components/schemas/ThemePreference'

    AuditLogEvent:
      type: object
      properties:
        event_id:
          type: string
        actor_user_id:
          type: [string, 'null']
        actor_email:
          type: [string, 'null']
          format: email
        actor_auth_type:
          type: string
          enum: [session, api_key, system]
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: [string, 'null']
        ip_address:
          type: [string, 'null']
        user_agent:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
      required:
        - event_id
        - actor_user_id
        - actor_email
        - actor_auth_type
        - action
        - target_type
        - target_id
        - ip_address
        - user_agent
        - metadata
        - created_at

    AuditLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEvent'
      required: [items]

    SettingsSummaryResponse:
      type: object
      properties:
        monthly_income:
          $ref: '#/components/schemas/NullableMoney'
        tags_count:
          type: integer
          minimum: 0
        cards_count:
          type: integer
          minimum: 0
        recurring_count:
          type: integer
          minimum: 0
        recurring_committed_total:
          $ref: '#/components/schemas/Money'
        avg_monthly_spend:
          $ref: '#/components/schemas/Money'
      required:
        - monthly_income
        - tags_count
        - cards_count
        - recurring_count
        - recurring_committed_total
        - avg_monthly_spend

    RequestEmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
      required: [new_email]

    EmailChangeRequestedResponse:
      type: object
      properties:
        email_change_id:
          type: string
        status:
          type: string
          enum: [verification_pending]
      required: [email_change_id, status]

    VerifyEmailChangeRequest:
      type: object
      properties:
        email_change_id:
          type: string
        verification_code:
          type: string
          pattern: '^\\d{6}$'
      required: [email_change_id, verification_code]

    EmailChangeVerifiedResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        email_verified:
          type: boolean
      required: [email, email_verified]

    ConvertAccountToGoogleRequest:
      type: object
      properties:
        google_id_token:
          type: string
          minLength: 1
      required: [google_id_token]

    CreateMasterApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          description: Null creates a non-expiring key. A date-time must be in the future and within MASTER_API_KEY_MAX_TTL_DAYS.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
      required: [name]

    MasterApiKeyMetadata:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        status:
          type: string
          enum: [active, expired, revoked]
      required: [id, name, key_prefix, created_at, last_used_at, expires_at, status]

    MasterApiKeyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MasterApiKeyMetadata'
      required: [items]

    CreateMasterApiKeyResponse:
      allOf:
        - $ref: '#/components/schemas/MasterApiKeyMetadata'
        - type: object
          properties:
            api_key:
              type: string
          required: [api_key]

    CreateNamedEntityRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]

    TagIconKey:
      type: string
      enum:
        - home
        - shopping_cart
        - car
        - plane
        - receipt
        - coffee
        - smartphone
        - credit_card
        - piggy_bank
        - trending_up
        - briefcase
        - heart
        - dumbbell
        - book_open
        - film
        - gamepad
        - gift
        - shield
        - lightbulb
        - wrench
        - wallet
        - tag

    CreateTagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        icon_key:
          anyOf:
            - $ref: '#/components/schemas/TagIconKey'
            - type: 'null'
      required: [name]

    Tag:
