          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/transactions/import.csv:
    post:
      tags: [ImportExport]
      summary: Import transactions from CSV
      description: Preview reads CSV headers, sample rows, and column value profiles. Dry run and commit validate an explicit header mapping, category strategy, and amount strategy before importing valid rows. Row-level errors are capped in the response.
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                mode:
                  type: string
                  enum: [preview, dry_run, commit]
                mapping:
                  type: string
                  description: JSON object mapping Budget fields to CSV headers. Required for dry_run and commit. Required fields are date, expense, amount, and tag. Category is required only when category_strategy.mode is exact_column; optional fields are card, is_split, and notes.
                date_strategy:
                  type: string
                  description: JSON object matching CsvImportDateStrategy. Applies an explicit year to yearless dates.
                category_strategy:
                  type: string
                  description: JSON object matching CsvImportCategoryStrategy. Supports exact_column, value_map, and default. Debt-like labels should map to needs and use Debt as the tag.
                tag_strategy:
                  type: string
                  description: JSON object matching CsvImportTagStrategy. Maps source tag values to existing or new tags.
                amount_strategy:
                  type: string
                  description: JSON object matching CsvImportAmountStrategy. Supports blank_mapped_amount=error or skip.
              required: [file, mode]
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CsvImportPreviewResponse'
                  - $ref: '#/components/schemas/CsvImportResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/data-runs:
    get:
      tags: [DataRuns]
      summary: List recent import/export activity
      description: Returns recent committed CSV imports and CSV exports for the authenticated user. Export records are activity-only and do not include saved CSV files.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of activity records to return. Values are clamped to 1..100.
      responses:
        '200':
          description: Recent data runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRunsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /me/imports/{import_run_id}/transactions:
    delete:
      tags: [ImportExport]
      summary: Roll back transactions from a CSV import
      description: Soft-deletes transactions created by a committed CSV import. Tags and cards are left in place. Imports committed before transaction rows stored import-run linkage return ROLLBACK_UNAVAILABLE.
      parameters:
        - name: import_run_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: Import rollback result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRollbackResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    sessionTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Use format `Session <session_token>`.
    masterApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Non-session master key for testing, format `bgtm_...`.

  parameters:
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Required for non-GET requests when using cookie sessions.
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        type: string
    ContextId:
      name: context_id
      in: path
      required: true
      schema:
        type: string
    FundId:
      name: fund_id
      in: path
      required: true
      schema:
        type: string
    FundEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
    RecurringExpenseId:
      name: recurring_expense_id
      in: path
      required: true
      schema:
        type: string
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
    Month:
      name: month
      in: query
      required: true
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}$'
    MonthPath:
      name: month
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}$'
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        format: date
    InsightsDateFrom:
      name: date_from
      in: query
      required: true
      schema:
        type: string
        format: date
    InsightsDateTo:
      name: date_to
      in: query
      required: true
      schema:
        type: string
        format: date
    Preset:
      name: preset
      in: query
      required: false
      schema:
        type: string
        enum: [last_7_days, last_30_days, month_to_date, last_month, quarter_to_date]
    SearchQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Case-insensitive substring match against expense, tag name, context name, and card name.
    Categories:
      name: categories
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated category values.
    TagIds:
      name: tag_ids
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated tag IDs.
    CardIds:
      name: card_ids
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated card IDs.
    ContextIds:
      name: context_ids
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated Context IDs.
    IsSplit:
      name: is_split
      in: query
      required: false
      schema:
        type: string
        enum: [split, not_split]
      description: Filter by split flag. Omit for all transactions.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [date_desc, date_asc]

  responses:
    UnauthorizedError:
      description: Authentication required or invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Action not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Conflict with current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitedError:
      description: Too many attempts in the configured rate-limit window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

