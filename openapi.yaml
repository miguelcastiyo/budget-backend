      required: [name]

    DataRunItem:
      type: object
      properties:
        id:
          type: string
          examples: [import_123, export_45]
        type:
          type: string
          enum: [import, export]
        status:
          type: string
          enum: [started, completed, partial, failed]
        created_at:
          type: string
          format: date-time
        source_filename:
          type: [string, 'null']
        date_from:
          type: [string, 'null']
          format: date
        date_to:
          type: [string, 'null']
          format: date
        total_rows:
          type: integer
          minimum: 0
        valid_rows:
          type: [integer, 'null']
          minimum: 0
        imported_rows:
          type: [integer, 'null']
          minimum: 0
        duplicate_rows:
          type: [integer, 'null']
          minimum: 0
        invalid_rows:
          type: [integer, 'null']
          minimum: 0
        skipped_rows:
          type: [integer, 'null']
          minimum: 0
        skipped_blank_amount_rows:
          type: [integer, 'null']
          minimum: 0
        error_summary:
          type: [string, 'null']
        rollback_available:
          type: boolean
        rolled_back_at:
          type: [string, 'null']
          format: date-time
        rolled_back_rows:
          type: integer
          minimum: 0
        rollback_unavailable_reason:
          type: [string, 'null']
          enum: [pre_rollback_feature, null]
      required:
        - id
        - type
        - status
        - created_at
        - source_filename
        - date_from
        - date_to
        - total_rows
        - valid_rows
        - imported_rows
        - duplicate_rows
        - invalid_rows
        - skipped_rows
        - skipped_blank_amount_rows
        - error_summary
        - rollback_available
        - rolled_back_at
        - rolled_back_rows
        - rollback_unavailable_reason

    DataRunsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataRunItem'
      required: [items]

    ImportRollbackResponse:
      type: object
      properties:
        status:
          type: string
          enum: [rolled_back]
        import_run_id:
          type: string
        deleted_rows:
          type: integer
          minimum: 0
      required: [status, import_run_id, deleted_rows]

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required: [field, message]

    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_ERROR
            - RATE_LIMITED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required: [code, message]

    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required: [error]

    CategoryEnum:
      type: string
      enum: [needs, wants, savings_debts]

    Money:
      type: string
      pattern: '^\\d+(\\.\\d{2})$'

    NullableMoney:
      oneOf:
        - $ref: '#/components/schemas/Money'
        - type: 'null'

    DecimalString:
      type: string
      pattern: '^\\d+(\\.\\d{2})$'

    NullableDecimalString:
      oneOf:
        - $ref: '#/components/schemas/DecimalString'
        - type: 'null'

    NullableShortLabel:
      oneOf:
        - type: string
          maxLength: 80
        - type: 'null'

    Percent:
      type: string
      pattern: '^\\d+(\\.\\d{2})$'
