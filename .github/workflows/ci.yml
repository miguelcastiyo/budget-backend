name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: openssl, mbstring, curl, pdo_mysql
          coverage: none

      - name: PHP syntax check
        run: |
          find src public scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate and install Composer dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist

      - name: Test
        run: php scripts/test_all.php
